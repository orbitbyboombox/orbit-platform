name: D-10 runtime validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "features/accounts-receivable/d10-*.ts"
      - "features/accounts-receivable/collection-email-status.ts"
      - "features/connectors/google-gmail/provider/google-gmail-live.provider.ts"
      - "features/connectors/google-gmail/application/d10-admin-test-email.ts"
      - "tests/accounts-receivable/d10-*.test.mts"
      - "tests/accounts-receivable/collection-email-status.test.mts"
      - "tests/accounts-receivable/d10-admin-email-test.test.mts"
      - ".github/workflows/d10-runtime-validation.yml"

permissions:
  contents: read

jobs:
  synthetic-runtime:
    name: Synthetic D-10 runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Enable pnpm
        run: npm install --global pnpm@10.28.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run D-10 policy, idempotency and Gmail-mock tests
        env:
          VERCEL_ENV: preview
          D10_DRY_RUN: "true"
          D10_QA_EMAIL_MOCK: "true"
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          --experimental-strip-types --test
          tests/accounts-receivable/d10-collection-policy.test.mts
          tests/accounts-receivable/d10-auto-policy.test.mts
          tests/accounts-receivable/d10-delivery.test.mts
          tests/accounts-receivable/collection-email-status.test.mts
          tests/accounts-receivable/d10-admin-email-test.test.mts

      - name: Assert no production transport configuration is present
        run: |
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${GOOGLE_WORKSPACE_ACCESS_TOKEN:-}"
          test -z "${GMAIL_ACCESS_TOKEN:-}"
          echo "Synthetic-only runtime job: no production transport credentials present."
