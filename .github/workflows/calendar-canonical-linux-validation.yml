name: Calendar canonical update Linux validation

on:
  pull_request:
    branches:
      - release/finance-staff-v217-20261115
    paths:
      - 'features/connectors/google-calendar/**'
      - 'features/projects/components/production-integration-panel.tsx'
      - 'supabase/migrations/20261127190000_canonical_calendar_update.sql'
      - 'tests/canonical-calendar-update.test.mts'
      - 'tests/google-calendar-remote-reconciliation.test.mts'
      - 'tests/fixtures/canonical-calendar-update-isolated-*.sql'
      - '.github/workflows/calendar-canonical-linux-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-canonical-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm exec eslint features/connectors/google-calendar/application/google-calendar-remote-reconciliation.ts features/connectors/google-calendar/application/google-calendar.actions.ts features/projects/components/production-integration-panel.tsx tests/canonical-calendar-update.test.mts
      - name: Focused reconciliation tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/canonical-calendar-update.test.mts tests/google-calendar-remote-reconciliation.test.mts
      - name: Next.js build
        run: pnpm exec next build

  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d calendar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify fixture and migration integrity
        run: |
          set -euo pipefail
          test -s tests/fixtures/canonical-calendar-update-isolated-schema.sql
          test -s tests/fixtures/canonical-calendar-update-isolated-tests.sql
          test -s supabase/migrations/20261127190000_canonical_calendar_update.sql
          sha256sum tests/fixtures/canonical-calendar-update-isolated-schema.sql \
            tests/fixtures/canonical-calendar-update-isolated-tests.sql \
            supabase/migrations/20261127190000_canonical_calendar_update.sql
      - name: Apply isolated production contract and exact PR migration
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d calendar_test -v ON_ERROR_STOP=1 \
            -f tests/fixtures/canonical-calendar-update-isolated-schema.sql
          psql -h 127.0.0.1 -U postgres -d calendar_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261127190000_canonical_calendar_update.sql
      - name: Execute RPC and security/idempotency checks
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d calendar_test -v ON_ERROR_STOP=1 \
            -f tests/fixtures/canonical-calendar-update-isolated-tests.sql
          psql -h 127.0.0.1 -U postgres -d calendar_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE fn regprocedure;
          BEGIN
            fn := to_regprocedure('public.apply_canonical_calendar_event_update(uuid,text,timestamptz,text,text,text,text,timestamptz,jsonb,integer,uuid)');
            IF fn IS NULL THEN RAISE EXCEPTION 'canonical calendar RPC is missing'; END IF;
            IF has_function_privilege('anon', fn, 'EXECUTE') OR has_function_privilege('public', fn, 'EXECUTE') THEN
              RAISE EXCEPTION 'canonical calendar RPC is publicly executable';
            END IF;
            IF NOT has_function_privilege('authenticated', fn, 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated role lacks canonical calendar RPC execute';
            END IF;
            IF NOT has_function_privilege('service_role', fn, 'EXECUTE') THEN
              RAISE EXCEPTION 'service_role lacks canonical calendar RPC execute';
            END IF;
          END $$;
          SQL
      - name: Concurrent idempotency check
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d calendar_test -v ON_ERROR_STOP=1 <<'SQL'
          update public.calendar_sync
          set status='UPDATE_REQUIRED', current_payload_hash='source-hash-2',
              last_synced_payload_hash=null, approved_remote_etag=null,
              approved_remote_source_hash=null, approved_remote_payload_hash=null,
              approved_remote_snapshot=null, approved_remote_at=null, approved_remote_by=null
          where id='20000000-0000-0000-0000-000000000002';
          SQL
          expected=$(psql -h 127.0.0.1 -U postgres -d calendar_test -Atqc "select updated_at from public.calendar_sync where id='20000000-0000-0000-0000-000000000002'")
          call="select public.apply_canonical_calendar_event_update('20000000-0000-0000-0000-000000000002','ORB-TEST-370-002','\$expected'::timestamptz,'source-hash-2','source-hash-2','remote-hash-2','etag-2','2026-11-27T12:00:00Z'::timestamptz,'{\"id\":\"remote-370-002\",\"calendarId\":\"calendar-370\",\"etag\":\"etag-2\"}'::jsonb,2,'00000000-0000-0000-0000-000000000001');"
          (printf "set role authenticated; select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',false); %s\n" "$call" | psql -h 127.0.0.1 -U postgres -d calendar_test -v ON_ERROR_STOP=1) &
          (printf "set role authenticated; select set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',false); %s\n" "$call" | psql -h 127.0.0.1 -U postgres -d calendar_test -v ON_ERROR_STOP=1) &
          wait
          count=$(psql -h 127.0.0.1 -U postgres -d calendar_test -Atqc "select count(*) from public.audit_events where action='CANONICAL_STATE_PUSHED' and orbit_event_id='ORB-TEST-370-002'")
          test "$count" = 1
