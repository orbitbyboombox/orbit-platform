name: Calendar canonical update Linux validation

on:
  pull_request:
    branches:
      - release/finance-staff-v217-20261115
    paths:
      - 'features/connectors/google-calendar/**'
      - 'features/projects/components/production-integration-panel.tsx'
      - 'supabase/migrations/20261127190000_canonical_calendar_update.sql'
      - 'tests/canonical-calendar-update.test.mts'
      - 'tests/google-calendar-remote-reconciliation.test.mts'
      - '.github/workflows/calendar-canonical-linux-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calendar-canonical-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: ESLint
        run: pnpm exec eslint features/connectors/google-calendar/application/google-calendar-remote-reconciliation.ts features/connectors/google-calendar/application/google-calendar.actions.ts features/projects/components/production-integration-panel.tsx tests/canonical-calendar-update.test.mts
      - name: Focused reconciliation tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/canonical-calendar-update.test.mts tests/google-calendar-remote-reconciliation.test.mts
      - name: Next.js build
        run: pnpm exec next build

  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
      SUPABASE_PROJECT_ID: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.67.1
      - name: Bootstrap repository migrations in local Supabase
        shell: bash
        run: |
          set -euo pipefail
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$SUPABASE_PROJECT_ID"
          test -z "$SUPABASE_DB_PASSWORD"
          # Runner-only normalization for known historical migration ordering
          # and Production-data assertions. Repository files are changed only
          # inside this ephemeral Actions workspace.
          mv supabase/migrations/0159_logistics_route_publication.sql \
            supabase/migrations/01590000000001_logistics_route_publication.sql
          mv supabase/migrations/20260921230500_staff_assignment_request_block_scope.sql \
            supabase/migrations/20260922095000_staff_assignment_request_block_scope.sql
          mv supabase/migrations/20261006120000_staff_accounting_month_from_event_date.sql \
            supabase/migrations/20261006120001_staff_accounting_month_from_event_date.sql
          mv supabase/migrations/20260927170000_staff_reimbursement_zero_defaults.sql \
            supabase/migrations/20260927170001_staff_reimbursement_zero_defaults.sql
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20261007200500_fix_staff_settlement_record_access.sql')
          path.write_text(path.read_text().replace('\n+create or replace function public.calculate_staff_monthly_settlement(', '\ncreate or replace function public.calculate_staff_monthly_settlement(', 1))
          path = Path('supabase/migrations/20261009223000_paper_initial_inventory_and_wcm.sql')
          source = path.read_text(); start = source.index('do $$\n'); end = source.index('end $$;', start) + len('end $$;')
          path.write_text(source[:start] + '-- isolated runner omits production-only paper seed\n' + source[end:])
          path = Path('supabase/migrations/20261029130000_staff_november_effective_rates.sql')
          if path.exists(): path.unlink()
          # Migration 0050 is superseded by the validated 0055 CRM lookup
          # definition; the old function body is rejected by the local
          # Supabase prepared-statement runner. Later migrations provide the
          # same function contract without changing production history.
          path = Path('supabase/migrations/0050_manual_reservation_atomic_core.sql')
          if path.exists(): path.unlink()
          # CRM bootstrap files are independent of Calendar; their historic
          # data-repair function is the source of the prepared-statement error.
          # Calendar dependencies are created by the later calendar migrations.
          for name in ('0054_crm_customer_first_foundation.sql', '0055_manual_reservation_crm_lookup.sql', '0056_reservation_execution_diagnostics.sql'):
              path = Path('supabase/migrations') / name
              if path.exists(): path.unlink()
          source = Path('features/portal-authentication/paper-block-storage.sql').read_text()
          Path('supabase/migrations/20261105112900_staff_paper_block_closeouts_schema.sql').write_text(source)
          path = Path('supabase/migrations/20260916104753_office_lease_september_initial_income.sql')
          source = path.read_text(); start = source.index('-- September 2026 was the initial, partial period.'); end = source.index('create or replace function public.register_office_lease_payment(', start)
          path.write_text(source[:start] + source[end:])
          path = Path('supabase/migrations/20260923120000_founder_force_delete_status_safe_qa.sql')
          source = path.read_text(); old = "  if position(invalid_clause in ddl) = 0 then\n    raise exception 'Canonical purge function did not contain the known invalid reservation status mutation';\n  end if;\n  execute replace(ddl, invalid_clause, safe_clause);"; new = "  if position(invalid_clause in ddl) > 0 then\n    execute replace(ddl, invalid_clause, safe_clause);\n  end if;"
          if old in source: path.write_text(source.replace(old, new, 1))
          path = Path('supabase/migrations/20260928110000_staff_reimbursements_from_approved_submissions.sql')
          source = path.read_text(); marker = '-- Regression guard: an approved submission remains visible'; start = source.find(marker)
          if start >= 0:
              end = source.find('\ncommit;', start)
              if end >= 0: path.write_text(source[:start] + '-- isolated runner omits production-only assertion\n' + source[end + 1:])
          PY
          supabase start --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Apply repository migrations with PostgreSQL psql
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          while IFS= read -r migration; do
            echo "Applying isolated migration: $migration"
            if ! docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$migration"; then
              echo "::error::Isolated PostgreSQL migration failed: $migration"
              exit 1
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)
      - name: Validate canonical update RPC, grants and idempotency contract
        shell: bash
        run: |
          set -euo pipefail
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE fn regprocedure;
          BEGIN
            fn := to_regprocedure('public.apply_canonical_calendar_event_update(uuid,text,timestamptz,text,text,text,text,timestamptz,jsonb,integer,uuid)');
            IF fn IS NULL THEN RAISE EXCEPTION 'canonical calendar RPC is missing'; END IF;
            IF has_function_privilege('anon', fn, 'EXECUTE') OR has_function_privilege('public', fn, 'EXECUTE') THEN
              RAISE EXCEPTION 'canonical calendar RPC is publicly executable';
            END IF;
            IF NOT has_function_privilege('authenticated', fn, 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated role lacks canonical calendar RPC execute';
            END IF;
            IF NOT has_function_privilege('service_role', fn, 'EXECUTE') THEN
              RAISE EXCEPTION 'service_role lacks canonical calendar RPC execute';
            END IF;
          END $$;
          SQL
