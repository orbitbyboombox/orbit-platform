name: Quotation policy checks
on:
  pull_request:
    paths:
      - 'src/lib/quotation-auto-reply-policy.ts'
      - 'tests/quotation-auto-reply-policy.test.mts'
      - '.github/workflows/quotation-policy-checks.yml'
  workflow_dispatch:
jobs:
  quotation-policy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Run isolated quotation policy tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/quotation-auto-reply-policy.test.mts
