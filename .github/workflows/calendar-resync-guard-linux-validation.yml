name: Calendar resync guard Linux validation

on:
  push:
    branches:
      - fix/calendar-resync-guard-v218
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: calendar_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d calendar_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create Supabase-compatible roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d calendar_guard_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then create role anon; end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then create role authenticated; end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then create role service_role; end if;
          end $$;
          SQL
      - name: Apply exact lease migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d calendar_guard_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261128120000_calendar_resync_lease_guard.sql
      - name: Validate lease, privileges, expiry and rollback
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d calendar_guard_test -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare fn regprocedure;
          begin
            fn := to_regprocedure('public.claim_calendar_resync_lease(text,uuid,integer)');
            if fn is null then raise exception 'claim function missing'; end if;
            if has_function_privilege('anon', fn, 'EXECUTE') or has_function_privilege('public', fn, 'EXECUTE') then raise exception 'lease claim is public'; end if;
            if not has_function_privilege('service_role', fn, 'EXECUTE') then raise exception 'service_role lacks lease claim'; end if;
            if has_table_privilege('anon', 'public.calendar_resync_leases', 'SELECT') or has_table_privilege('authenticated', 'public.calendar_resync_leases', 'SELECT') then raise exception 'lease table is directly readable'; end if;
          end $$;
          truncate public.calendar_resync_leases;
          do $$
          begin
            perform public.claim_calendar_resync_lease('invalid', '00000000-0000-0000-0000-000000000001', 1);
            raise exception 'invalid lease duration was accepted';
          exception when sqlstate '22023' then null;
          end $$;
          if (select count(*) from public.calendar_resync_leases) <> 0 then raise exception 'invalid request left a lease'; end if;
          SQL
          printf "select public.claim_calendar_resync_lease('google-calendar-resync','00000000-0000-0000-0000-000000000001',300);\n" | psql -h 127.0.0.1 -U postgres -d calendar_guard_test -At > /tmp/lease-a.out &
          printf "select public.claim_calendar_resync_lease('google-calendar-resync','00000000-0000-0000-0000-000000000002',300);\n" | psql -h 127.0.0.1 -U postgres -d calendar_guard_test -At > /tmp/lease-b.out &
          wait
          winners=$(cat /tmp/lease-a.out /tmp/lease-b.out | tr -d '[:space:]' | grep -o 't' | wc -l | tr -d ' ')
          test "$winners" = "1"
          psql -h 127.0.0.1 -U postgres -d calendar_guard_test -v ON_ERROR_STOP=1 <<'SQL'
          update public.calendar_resync_leases set expires_at = clock_timestamp() - interval '1 second' where scope = 'google-calendar-resync';
          do $$
          begin
            if not public.claim_calendar_resync_lease('google-calendar-resync','00000000-0000-0000-0000-000000000003',300) then raise exception 'expired lease was not reclaimable'; end if;
            if not public.release_calendar_resync_lease('google-calendar-resync','00000000-0000-0000-0000-000000000003') then raise exception 'lease release failed'; end if;
            if exists (select 1 from public.calendar_resync_leases where scope='google-calendar-resync') then raise exception 'lease remained after release'; end if;
          end $$;
          SQL
