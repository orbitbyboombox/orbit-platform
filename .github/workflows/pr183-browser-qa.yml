name: PR183 isolated login security regression
on:
  push:
    branches: [fix/paper-block-handoff-clean-20261105]
    paths: ['qa/pr183/**', '.github/workflows/pr183-browser-qa.yml']
permissions:
  contents: read
concurrency:
  group: pr183-browser-qa-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_BROWSERS_PATH: /opt/pr183-browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: harness
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: app
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare exact app and QA-only harness
        working-directory: app
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test -z "$(git status --porcelain)"
          mkdir -p qa/pr183 "$RUNNER_TEMP/pr183-evidence"
          cp ../harness/qa/pr183/* qa/pr183/
          echo "Focused login security QA; application at triggering commit" > "$RUNNER_TEMP/pr183-evidence/setup.log"
          npm install --ignore-scripts --no-package-lock --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
          sudo mkdir -p /opt/pr183-browsers
          sudo chown "$USER" /opt/pr183-browsers
          npx playwright install --with-deps chromium
          chmod -R a+rX /opt/pr183-browsers
          echo '127.0.0.1 pr183-local.supabase.co' | sudo tee -a /etc/hosts
      - name: Bootstrap disposable local Supabase (no approved tests repeated)
        working-directory: app
        env:
          SUPABASE_ACCESS_TOKEN: ''
          SUPABASE_DB_PASSWORD: ''
          SUPABASE_PROJECT_ID: ''
        run: |
          set -euo pipefail
          timeout 600 bash qa/pr183/bootstrap.sh > /tmp/pr183-bootstrap.log 2>&1 &
          bootstrap_pid=$!
          while kill -0 "$bootstrap_pid" 2>/dev/null; do
            echo "Local bootstrap active; last progress:"
            grep -E 'Pulling|Downloading|Applying migration|Starting|ERROR|failed|health' /tmp/pr183-bootstrap.log | tail -3 | sed -E 's/eyJ[^ ]+/[REDACTED]/g' || true
            sleep 20
          done
          grep -E 'Pulling|Downloading|Applying migration|Starting|ERROR|failed|health' /tmp/pr183-bootstrap.log | sed -E 's/eyJ[^ ]+/[REDACTED]/g' > "$RUNNER_TEMP/pr183-evidence/bootstrap.log" || true
          wait "$bootstrap_pid" || { tail -80 /tmp/pr183-bootstrap.log | sed -E 's/eyJ[^ ]+/[REDACTED]/g'; exit 1; }
          supabase status -o env > /tmp/pr183-local.env
          chmod 600 /tmp/pr183-local.env
          docker exec -i supabase_db_orbit_pr183_isolated psql -U postgres -d postgres -v ON_ERROR_STOP=1 < qa/pr183/seed.sql > "$RUNNER_TEMP/pr183-evidence/seed.log" 2>&1
      - name: Login security Playwright with outbound blocking
        working-directory: app
        env:
          QA_OUTPUT: ${{ runner.temp }}/pr183-evidence
          QA_EXPECTED_SHA: ${{ github.sha }}
        run: python3 qa/pr183/launch.py
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr183-browser-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/pr183-evidence
          retention-days: 7
          if-no-files-found: error
      - name: Stop disposable stack
        if: always()
        working-directory: app
        run: supabase stop --no-backup || true
