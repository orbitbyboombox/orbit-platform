name: PR 183 code validation
on:
  pull_request:
    paths:
      - 'features/operations/admin-paper-block*'
      - 'features/portal-authentication/*paper*'
      - 'supabase/migrations/20261105*paper*'
      - 'supabase/migrations/20261106*paper*'
      - 'tests/*paper*'
      - '.github/workflows/pr183-code-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock
      - name: Seven-case AM/PM and admin tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON --experimental-strip-types --test tests/paper-block-reconciliation.test.mts tests/paper-block-seven-cases.test.mts tests/admin-paper-block-manual.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
