name: ORBIT Supabase Storage backup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type STORAGE-BACKUP-ORBIT-2.1 to confirm a Storage-only backup"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orbit-supabase-storage-backup
  cancel-in-progress: false

jobs:
  storage-backup:
    if: ${{ inputs.confirmation == 'STORAGE-BACKUP-ORBIT-2.1' }}
    runs-on: ubuntu-24.04
    environment: orbit-backup-production
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Checkout exact backup source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies without lifecycle scripts
        run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate protected configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"
          mkdir -p "$RUNNER_TEMP/orbit-storage-backup/storage"

      - name: Run backup safety tests
        run: node --test tests/issue-66-backup-security.test.mts

      - name: Export Storage and SHA-256 manifest
        run: |
          node scripts/export-supabase-storage.mjs \
            "$RUNNER_TEMP/orbit-storage-backup/storage" \
            "$RUNNER_TEMP/orbit-storage-backup/storage-manifest.json"

      - name: Encrypt all Storage data and metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/orbit-storage-backup"
          tar -czf "$work/storage.tar.gz" -C "$work/storage" .
          for source in storage.tar.gz storage-manifest.json; do
            printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
              -pass stdin -in "$work/$source" -out "$work/$source.enc"
          done
          rm -rf "$work/storage" "$work/storage.tar.gz" "$work/storage-manifest.json"
          (cd "$work" && sha256sum storage.tar.gz.enc storage-manifest.json.enc > encrypted-sha256sums.txt)
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass stdin -in "$work/encrypted-sha256sums.txt" -out "$work/encrypted-sha256sums.txt.enc"
          rm -f "$work/encrypted-sha256sums.txt"
          test "$(find "$work" -maxdepth 1 -type f -name '*.enc' | wc -l)" -eq 3

      - name: Stage encrypted artifact for authenticated Drive transfer
        uses: actions/upload-artifact@v4
        with:
          name: orbit-storage-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/orbit-storage-backup/*.enc
          retention-days: 7
          if-no-files-found: error

      - name: Cleanup temporary Storage material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/orbit-storage-backup"
