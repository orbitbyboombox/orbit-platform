name: ORBIT Supabase Storage backup

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type STORAGE-BACKUP-ORBIT-2.1 to confirm a Storage-only backup"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: orbit-supabase-storage-backup
  cancel-in-progress: false

jobs:
  storage-backup:
    if: ${{ inputs.confirmation == 'STORAGE-BACKUP-ORBIT-2.1' }}
    runs-on: ubuntu-24.04
    environment: orbit-backup-production
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_PARENT_FOLDER_ID }}

    steps:
      - name: Checkout exact backup source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Validate protected Storage-only configuration
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/orbit-storage-backup/storage"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE"
          test -n "$GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON"
          test -n "$GOOGLE_DRIVE_PARENT_FOLDER_ID"

      - name: Run backup safety tests
        run: node --test tests/issue-66-backup-security.test.mts

      - name: Export Storage objects and checksums
        run: |
          node scripts/export-supabase-storage.mjs \
            "$RUNNER_TEMP/orbit-storage-backup/storage" \
            "$RUNNER_TEMP/orbit-storage-backup/storage-manifest.json"

      - name: Encrypt Storage archive and manifests
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/orbit-storage-backup"
          tar -czf "$work/storage.tar.gz" -C "$work/storage" .
          for source in storage.tar.gz storage-manifest.json; do
            printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
              -pass stdin -in "$work/$source" -out "$work/$source.enc"
          done
          rm -rf "$work/storage" "$work/storage.tar.gz" "$work/storage-manifest.json"
          node scripts/write-storage-backup-manifest.mjs "$work" "$GITHUB_SHA"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass stdin -in "$work/storage-backup-manifest.json" -out "$work/storage-backup-manifest.json.enc"
          rm -f "$work/storage-backup-manifest.json"
          sha256sum "$work"/*.enc > "$work/sha256sums.txt"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" | openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass stdin -in "$work/sha256sums.txt" -out "$work/sha256sums.txt.enc"
          rm -f "$work/sha256sums.txt"

      - name: Upload encrypted Storage backup and verify Drive readback
        run: |
          npm install --no-save --no-package-lock googleapis@144.0.0
          node scripts/upload-drive-backup.mjs "$RUNNER_TEMP/orbit-storage-backup"

      - name: Cleanup temporary Storage backup material
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf "$RUNNER_TEMP/orbit-storage-backup"
