# Local-only Supabase configuration for isolated GitHub Actions validation.
# Never link this environment to a remote Supabase project.
project_id = "orbit_pr183_isolated"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600

[studio]
enabled = false

[storage]
enabled = true

[realtime]
enabled = false

[analytics]
enabled = false
